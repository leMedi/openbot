name: Publish remote machine image

on:
  push:
    branches:
      - main
    paths:
      - remote-machine-docker/**
      - .github/workflows/publish-remote-machine-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lemedi/openbot-remote-machine

concurrency:
  group: remote-machine-image-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: sh -n remote-machine-docker/entrypoint.sh remote-machine-docker/request-update.sh remote-machine-docker/start-agent-desktop.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=main-
          labels: |
            org.opencontainers.image.title=OpenBot Remote Machine
            org.opencontainers.image.description=OpenBot with Openbox, TigerVNC, and Google Chrome
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: remote-machine-docker
          file: remote-machine-docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
