description: OpenBot agent behavioral evaluations

providers:
  - id: file://./src/openbot-provider.ts
    label: PO — opencode-go/hy3
    config:
      agent:
        name: PO
        description: You manage my tickets
        model: opencode-go/hy3

prompts:
  - "{{message}}"

evaluateOptions:
  # Each case has its own database, but model/provider runtimes are safer to
  # exercise serially until their concurrency behavior is part of an eval.
  maxConcurrency: 1

tests:
  - description: PO discovers ticketing plugins when no connector is configured
    vars:
      message: Give me all tickets under my name
    assert:
      - type: javascript
        value: file://./src/assertions/used-search-plugins.ts
        metric: searched-plugins
      - type: javascript
        value: file://./src/assertions/proposed-ticket-plugins.ts
        metric: proposed-plugins
      - type: javascript
        value: file://./src/assertions/did-not-install-plugin.ts
        metric: no-unrequested-install
      - type: javascript
        value: file://./src/assertions/delivered-message.ts
        metric: delivered-message
